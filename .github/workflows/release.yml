name: Release

on:
  workflow_dispatch:
    inputs:
      version_tag:
        description: Release tag matching VERSION and CHANGELOG.md
        required: true
        type: string

concurrency:
  group: release-${{ inputs.version_tag }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  preflight:
    name: Validate release
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ inputs.version_tag }}
        run: node scripts/release/validate-release-tag.cjs "$RELEASE_TAG" --mode preflight

      - name: Install repository tooling
        run: npm ci

      - name: Test repository scripts
        run: npm run scripts:test

  build-and-test:
    name: Build and test (${{ matrix.os }})
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Install dependencies
        run: npm ci

      - name: Check file LOC limits
        shell: bash
        run: bash scripts/code/check-file-loc.sh

      - name: Check formatting, syntax, behavior, and compilation
        run: node scripts/check.mjs

      - name: Build standalone CLI with embedded frontend
        run: node scripts/build.mjs

      - name: Run race tests
        if: runner.os == 'Linux'
        run: go test -race ./...

  tag-and-release:
    name: Create tag and GitHub Release
    needs:
      - build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24.19.0

      - name: Revalidate release tag
        env:
          RELEASE_TAG: ${{ inputs.version_tag }}
        run: node scripts/release/validate-release-tag.cjs "$RELEASE_TAG" --mode ci

      - name: Extract release notes
        env:
          RELEASE_TAG: ${{ inputs.version_tag }}
        run: node scripts/release/extract-release-notes.cjs "$RELEASE_TAG" --output release-notes.md

      - name: Create and push annotated tag
        env:
          RELEASE_TAG: ${{ inputs.version_tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            if [ "$(git rev-list -n 1 "$RELEASE_TAG")" != "$(git rev-parse HEAD)" ]; then
              echo "Release tag $RELEASE_TAG already points to a different commit."
              exit 1
            fi
            echo "Release tag $RELEASE_TAG already points to this commit."
            exit 0
          fi
          git tag -a "$RELEASE_TAG" -m "$RELEASE_TAG release"
          git push origin "$RELEASE_TAG"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.version_tag }}
          name: ${{ inputs.version_tag }}
          body_path: release-notes.md
          prerelease: ${{ contains(inputs.version_tag, '-') }}
