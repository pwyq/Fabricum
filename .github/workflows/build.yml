name: Build

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Install Windows UCRT64 GCC
        if: runner.os == 'Windows'
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-gcc
      - name: Setup static Windows PNG build tools
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          rustup toolchain install 1.88.0-x86_64-pc-windows-msvc --profile minimal --target x86_64-pc-windows-gnu
          $gccDirectory = Join-Path $env:MSYS2_LOCATION 'ucrt64\bin'
          if (!(Test-Path -LiteralPath "$gccDirectory\gcc.exe")) { throw 'MinGW UCRT64 GCC is required' }
          $gccDirectory | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Install pinned native codec tools
        run: node scripts/install-native-codecs.mjs
      - name: Install repository dependencies
        run: npm ci
      - name: Check formatting, syntax, behavior, and compilation
        run: node scripts/check.mjs
      - name: Check file LOC limits
        shell: bash
        run: bash scripts/code/check-file-loc.sh
      - name: Build and test standalone binary
        run: npm run release:binary
      - name: Run race tests
        if: runner.os == 'Linux'
        run: go test -race ./...
