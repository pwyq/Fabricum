name: Build

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Install pinned native codec tools
        run: node scripts/install-native-codecs.mjs
      - name: Install repository dependencies
        run: npm ci
      - name: Check formatting, syntax, behavior, and compilation
        run: node scripts/check.mjs
      - name: Check file LOC limits
        shell: bash
        run: bash scripts/code/check-file-loc.sh
      - name: Build standalone CLI with embedded frontend
        run: node scripts/build.mjs
      - name: Run race tests
        if: runner.os == 'Linux'
        run: go test -race ./...
